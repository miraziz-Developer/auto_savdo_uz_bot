services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: avtosavdo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-avtosavdo_bot}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-avtosavdo_bot}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - avtosavdo_network

  # Telegram Bot (Lite Mode — no Celery, no Redis, no Playwright)
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avtosavdo_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_PASSWORD=${DB_PASSWORD:-postgres123}
      - MPLCONFIGDIR=/tmp/matplotlib_cache
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./analytics/reports:/app/analytics/reports
    networks:
      - avtosavdo_network

  # PostgreSQL Backup (Daily snapshots)
  backup:
    image: prodrigestivill/postgres-backup-local:15-alpine
    container_name: avtosavdo_backup
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${DB_NAME:-avtosavdo_bot}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres123}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - avtosavdo_network

networks:
  avtosavdo_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
